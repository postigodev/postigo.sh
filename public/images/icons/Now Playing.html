<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Now Playing</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      :root {
        --surface: #c0c0c0;
        --button-highlight: #ffffff;
        --button-face: #dfdfdf;
        --button-shadow: #808080;
        --light-button-shadow: #a9a9a9;
        --window-frame: #0a0a0a;

        --border-field:
          inset -1px -1px var(--button-highlight),
          inset 1px 1px var(--button-shadow),
          inset -2px -2px var(--button-face), inset 2px 2px var(--window-frame);
      }

      @font-face {
        font-family: "Pixelated MS Sans Serif";
        src:
          url("https://files.catbox.moe/qgjjre.woff") format("woff"),
          url("https://files.catbox.moe/8fwbkl.woff2") format("woff2");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Pixelated MS Sans Serif";
        src:
          url("https://files.catbox.moe/z7csle.woff") format("woff"),
          url("https://files.catbox.moe/moqhx6.woff2") format("woff2");
        font-weight: bold;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070a0e;
      }

      .music-player {
        /*
        Fallback palette.
        JS overwrites these using the album cover.
      */
        --cover-dark: #6a1535;
        --cover-mid: #b23965;
        --cover-light: #f9a5b9;
        --cover-muted: #8f3557;

        --dialog-blue: var(--cover-dark);
        --dialog-accent: #ffffff;
        --titlebar-color: #ffffff;

        --titlebar-gradient: linear-gradient(
          90deg,
          var(--cover-dark),
          var(--cover-mid),
          var(--cover-light)
        );

        position: relative;

        width: 282px;
        padding: 3px;

        overflow: hidden;

        color: var(--window-frame);
        background: var(--surface);

        border: 1px solid var(--window-frame);

        box-shadow:
          inset -1px -1px var(--window-frame),
          inset 1px 1px var(--button-face),
          inset -2px -2px var(--button-shadow),
          inset 2px 2px var(--button-highlight);

        font-family: "Pixelated MS Sans Serif", Arial, sans-serif;

        -webkit-font-smoothing: none;

        font-size: 11px;
      }

      .music-player::before {
        content: "";

        position: absolute;
        inset: 0;

        z-index: 0;

        pointer-events: none;

        opacity: 0.15;

        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");

        filter: contrast(1.35) brightness(0.78);

        mix-blend-mode: multiply;
      }

      .music-player::after {
        content: "";

        position: absolute;
        inset: 0;

        z-index: 0;

        pointer-events: none;

        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(255, 255, 255, 0.09),
            transparent 36%
          ),
          radial-gradient(
            ellipse at 85% 85%,
            rgba(0, 0, 0, 0.15),
            transparent 55%
          );
      }

      .title-bar,
      .player-screen,
      .player-bottom {
        position: relative;
        z-index: 1;
      }

      /* ---------------------------------
       TITLE BAR
    --------------------------------- */

      .title-bar {
        height: 18px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 2px 2px 2px 3px;
        margin-bottom: 3px;

        color: var(--titlebar-color);
        background: var(--titlebar-gradient);

        font-weight: bold;
        line-height: 1.5;

        text-shadow: 1px 1px rgba(0, 0, 0, 0.3);
      }

      .title-bar-title {
        min-width: 0;

        display: flex;
        align-items: center;
        gap: 4px;
      }

      .title-bar-title span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .spotify-icon {
        display: block;

        width: 13px;
        height: 13px;

        flex: 0 0 auto;

        object-fit: contain;

        image-rendering: pixelated;
      }

      .title-bar-controls {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        gap: 2px;
      }

      .music-player .window-button {
        position: relative;

        width: 16px;
        height: 14px;
        min-width: 16px;
        min-height: 14px;
        flex: 0 0 16px;

        margin: 0;
        padding: 0;

        border: none;
        border-radius: 0;

        appearance: none;
        -webkit-appearance: none;

        color: inherit;
        background: var(--surface);

        box-shadow:
          inset -1px -1px var(--window-frame),
          inset 1px 1px var(--button-highlight),
          inset -2px -2px var(--button-shadow),
          inset 2px 2px var(--button-face);
      }

      .music-player .window-button:active {
        box-shadow:
          inset -1px -1px var(--button-highlight),
          inset 1px 1px var(--window-frame),
          inset -2px -2px var(--button-face),
          inset 2px 2px var(--button-shadow);
      }

      .music-player .window-button:focus {
        outline: 1px dotted #000;
        outline-offset: -4px;
      }

      .window-button--minimize::after {
        content: "";

        position: absolute;

        left: 4px;
        bottom: 3px;

        width: 6px;
        height: 2px;

        background: #000;
      }

      .window-button--close::before,
      .window-button--close::after {
        content: "";

        position: absolute;

        left: 7px;
        top: 3px;

        width: 1px;
        height: 8px;

        background: #000;
      }

      .window-button--close::before {
        transform: rotate(45deg);
      }

      .window-button--close::after {
        transform: rotate(-45deg);
      }

      /* ---------------------------------
       SCREEN
    --------------------------------- */

      .player-screen {
        min-height: 78px;

        display: grid;
        grid-template-columns: 66px minmax(0, 1fr);

        gap: 7px;
        align-items: center;

        padding: 5px;

        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025),
            rgba(0, 0, 0, 0.055)
          ),
          var(--surface);

        box-shadow: var(--border-field);
      }

      /* ---------------------------------
       ALBUM
    --------------------------------- */

      .album {
        position: relative;

        width: 64px;
        height: 64px;

        padding: 2px;

        overflow: hidden;

        background: linear-gradient(
          -45deg,
          var(--button-face) 50%,
          var(--window-frame) 50%
        );

        border-width: 1px;
        border-style: solid;

        border-color: var(--button-shadow) var(--button-highlight)
          var(--button-highlight) var(--button-shadow);
      }

      .album img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;

        image-rendering: pixelated;

        filter: saturate(1.58) contrast(1.28) brightness(0.94);
      }

      .music-player.is-playing .album img {
        animation: playing-art 2.15s steps(4, end) infinite;
      }

      @keyframes playing-art {
        0%,
        100% {
          filter: saturate(1.58) contrast(1.28) brightness(0.94);
        }

        25% {
          filter: saturate(1.74) contrast(1.34) brightness(0.99);
        }

        50% {
          filter: saturate(1.63) contrast(1.3) brightness(0.89);
        }

        75% {
          filter: saturate(1.82) contrast(1.36) brightness(0.96);
        }
      }

      .music-player.is-playing .album::after {
        content: "";

        position: absolute;

        left: 2px;
        right: 2px;
        top: 2px;

        height: 6px;

        pointer-events: none;

        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.15),
          transparent
        );

        mix-blend-mode: screen;

        animation: artwork-scan 3.2s linear infinite;
      }

      @keyframes artwork-scan {
        from {
          transform: translateY(-8px);
        }

        to {
          transform: translateY(64px);
        }
      }

      /* ---------------------------------
       TRACK
    --------------------------------- */

      .track {
        min-width: 0;

        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .track-status {
        width: fit-content;

        margin-bottom: 4px;
        padding: 2px 4px;

        color: var(--dialog-accent);
        background: var(--dialog-blue);

        font-size: 9px;
        font-weight: normal;
        line-height: 11px;
      }

      .track-title,
      .track-artist,
      .track-album {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .track-title {
        font-size: 11px;
        font-weight: bold;
        line-height: 13px;
      }

      .track-artist {
        margin-top: 1px;

        font-size: 11px;
        line-height: 13px;
      }

      .track-album {
        color: #525252;

        font-size: 10px;
        line-height: 13px;
      }

      /* ---------------------------------
       PROGRESS
    --------------------------------- */

      .progress {
        height: 7px;

        margin-top: 5px;
        padding: 2px;

        overflow: hidden;

        background: var(--button-highlight);

        box-shadow: var(--border-field);
      }

      .progress-fill {
        width: 72%;
        height: 100%;

        background: repeating-linear-gradient(
          90deg,
          var(--cover-dark) 0,
          var(--cover-dark) 4px,
          var(--cover-muted) 4px,
          var(--cover-muted) 5px
        );
      }

      /* ---------------------------------
       BOTTOM STATUS
    --------------------------------- */

      .player-bottom {
        height: 20px;

        display: flex;
        align-items: center;

        margin-top: 3px;
        padding: 2px 4px;

        color: #222;

        font-size: 10px;
        font-weight: normal;
      }

      .status-field {
        height: 16px;

        flex: 1;

        display: flex;
        align-items: center;

        padding: 0 3px;
        gap: 4px;
        overflow: hidden;

        box-shadow:
          inset -1px -1px var(--button-highlight),
          inset 1px 1px var(--button-shadow);
      }

      .music-note {
        width: 8px;
        height: 8px;
      }

      .battery {
        height: 16px;

        display: flex;
        align-items: center;
        gap: 1px;

        margin-left: 3px;
        padding: 3px 4px;

        box-shadow:
          inset -1px -1px var(--button-highlight),
          inset 1px 1px var(--button-shadow);
      }

      .battery i {
        display: block;

        width: 4px;
        height: 7px;

        background: var(--cover-dark);

        border-right: 1px solid rgba(255, 255, 255, 0.25);
      }

      .battery i:nth-child(2) {
        background: var(--cover-mid);
      }

      .battery i:last-child {
        background: var(--cover-light);
      }

      @media (prefers-reduced-motion: reduce) {
        .music-player.is-playing .album img,
        .music-player.is-playing .album::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body cz-shortcut-listen="true">
    <div class="music-player is-playing" style="--cover-dark: hsl(33 78% 23%); --cover-mid: hsl(40 75% 43%); --cover-light: hsl(60 50% 72%); --cover-muted: hsl(33 65% 36%);">
      <div class="title-bar">
        <div class="title-bar-title">
          <img class="spotify-icon" src="./Now Playing_files/spotify.svg" alt="" aria-hidden="true">

          <span>Spotify</span>
        </div>

        <div class="title-bar-controls">
          <button class="window-button window-button--minimize" type="button" aria-label="Minimize"></button>

          <button class="window-button window-button--close" type="button" aria-label="Close"></button>
        </div>
      </div>

      <div class="player-screen">
        <div class="album">
          <img id="album-cover" crossorigin="anonymous" src="./Now Playing_files/ab67616d0000b273c5246f80d22d902d0be31cbf" alt="Corazones — Los Prisioneros">
        </div>

        <div class="track">
          <div class="track-status">NOW PLAYING</div>

          <div class="track-title">Tren Al Sur</div>

          <div class="track-artist">Los Prisioneros</div>

          <div class="track-album">Corazones</div>

          <div class="progress">
            <div class="progress-fill"></div>
          </div>
        </div>
      </div>

      <div class="player-bottom">
        <div class="status-field">
          <img src="./Now Playing_files/music.svg" class="music-note" alt="music">

          <span> now playing </span>
        </div>

        <div class="battery" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </div>
      </div>
    </div>

    <script>
      const player = document.querySelector(".music-player");

      const albumImage = document.querySelector("#album-cover");

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function rgbToHsl(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);

        let h = 0;
        let s = 0;

        const l = (max + min) / 2;
        const d = max - min;

        if (d !== 0) {
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

          switch (max) {
            case r:
              h = (g - b) / d + (g < b ? 6 : 0);
              break;

            case g:
              h = (b - r) / d + 2;
              break;

            case b:
              h = (r - g) / d + 4;
              break;
          }

          h /= 6;
        }

        return {
          h: h * 360,
          s: s * 100,
          l: l * 100,
        };
      }

      function hslToCss(color) {
        return (
          `hsl(` +
          `${color.h.toFixed(0)} ` +
          `${color.s.toFixed(0)}% ` +
          `${color.l.toFixed(0)}%` +
          `)`
        );
      }

      function colorDistance(a, b) {
        const dr = a.r - b.r;
        const dg = a.g - b.g;
        const db = a.b - b.b;

        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      function extractCoverPalette(img) {
        const canvas = document.createElement("canvas");

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true,
        });

        if (!ctx) {
          return null;
        }

        const size = 32;

        canvas.width = size;
        canvas.height = size;

        ctx.drawImage(img, 0, 0, size, size);

        const pixels = ctx.getImageData(0, 0, size, size).data;

        const buckets = new Map();

        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];
          const a = pixels[i + 3];

          if (a < 200) {
            continue;
          }

          const hsl = rgbToHsl(r, g, b);

          /*
          Ignore nearly black / nearly white pixels.
        */
          if (hsl.l < 6 || hsl.l > 94) {
            continue;
          }

          /*
          Group nearby RGB colors.
        */
          const step = 24;

          const qr = clamp(Math.round(r / step) * step, 0, 255);

          const qg = clamp(Math.round(g / step) * step, 0, 255);

          const qb = clamp(Math.round(b / step) * step, 0, 255);

          const key = `${qr},${qg},${qb}`;

          if (buckets.has(key)) {
            buckets.get(key).count++;
          } else {
            buckets.set(key, {
              r: qr,
              g: qg,
              b: qb,
              count: 1,
            });
          }
        }

        const candidates = [...buckets.values()]
          .map((color) => ({
            ...color,

            hsl: rgbToHsl(color.r, color.g, color.b),
          }))
          .filter((color) => color.hsl.s > 10);

        candidates.sort((a, b) => {
          const scoreA = a.count * (1 + a.hsl.s / 130);

          const scoreB = b.count * (1 + b.hsl.s / 130);

          return scoreB - scoreA;
        });

        if (!candidates.length) {
          return null;
        }

        const primary = candidates[0];

        const secondary =
          candidates.find(
            (candidate) => colorDistance(primary, candidate) > 60,
          ) ||
          candidates[1] ||
          primary;

        const tertiary =
          candidates.find(
            (candidate) =>
              colorDistance(primary, candidate) > 80 &&
              colorDistance(secondary, candidate) > 55,
          ) || secondary;

        /*
        Extract hue from the cover,
        normalize lightness so the UI
        remains readable.
      */
        const dark = {
          h: primary.hsl.h,

          s: clamp(primary.hsl.s, 38, 78),

          l: 23,
        };

        const mid = {
          h: secondary.hsl.h,

          s: clamp(secondary.hsl.s, 42, 82),

          l: 43,
        };

        const light = {
          h: tertiary.hsl.h,

          s: clamp(tertiary.hsl.s, 35, 75),

          l: 72,
        };

        const muted = {
          h: primary.hsl.h,

          s: clamp(primary.hsl.s * 0.75, 25, 65),

          l: 36,
        };

        return {
          dark,
          mid,
          light,
          muted,
        };
      }

      function applyCoverTheme() {
        try {
          const palette = extractCoverPalette(albumImage);

          if (!palette) {
            return;
          }

          player.style.setProperty("--cover-dark", hslToCss(palette.dark));

          player.style.setProperty("--cover-mid", hslToCss(palette.mid));

          player.style.setProperty("--cover-light", hslToCss(palette.light));

          player.style.setProperty("--cover-muted", hslToCss(palette.muted));

          /*
          Optional debug:
          see the extracted palette in DevTools.
        */
          console.log("Album palette:", {
            dark: hslToCss(palette.dark),

            mid: hslToCss(palette.mid),

            light: hslToCss(palette.light),

            muted: hslToCss(palette.muted),
          });
        } catch (error) {
          /*
          If Spotify CDN blocks canvas access
          through CORS, the fallback palette
          stays active.
        */
          console.warn("Couldn't extract album palette:", error);
        }
      }

      function themeAfterImageLoad() {
        if (albumImage.complete && albumImage.naturalWidth) {
          applyCoverTheme();
        } else {
          albumImage.addEventListener("load", applyCoverTheme, {
            once: true,
          });
        }
      }

      themeAfterImageLoad();

      /*
      Automatically recalculate palette if your
      Spotify integration changes img.src.
    */
      const coverObserver = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          if (
            mutation.type === "attributes" &&
            mutation.attributeName === "src"
          ) {
            albumImage.addEventListener("load", applyCoverTheme, {
              once: true,
            });
          }
        }
      });

      coverObserver.observe(albumImage, {
        attributes: true,
        attributeFilter: ["src"],
      });
    </script>
